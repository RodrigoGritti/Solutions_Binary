services:
  - type: web
    name: solutions-binary
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    pullRequestPreviewsEnabled: false
    envVars:
      # Definir o valor no painel do Render (Environment) — nunca commitar a chave.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PREVIEW_MODEL
        value: claude-sonnet-5
