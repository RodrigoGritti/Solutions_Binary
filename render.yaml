services:
  - type: web
    name: solutions-binary
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    pullRequestPreviewsEnabled: false
    envVars:
      # Definir o valor no painel do Render (Environment) — nunca commitar a chave.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PREVIEW_MODEL
        value: claude-sonnet-5
      # Persistência das sessões do robô de WhatsApp (db/bot_sessions.sql).
      # Sem essas duas, o robô funciona igual, só que a conversa se perde
      # se o servidor reiniciar (é isso que fazia ele "se apresentar" de novo).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
